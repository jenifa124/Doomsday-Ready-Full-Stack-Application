services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_PATH: /data/doomsday.sqlite
    volumes:
      - sqlite_data:/data
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:5000
    depends_on:
      - backend
volumes:
  sqlite_data:
